<VirtualHost *:8080>
    DocumentRoot /app/project-links

    <Directory /app/project-links>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On

    <IfModule mod_proxy.c>
        ProxyPreserveHost On
        ProxyRequests Off
    </IfModule>
</VirtualHost>
