services:
  web-agent:
    build: .
    container_name: web-agent
    ports:
      - "89:89"
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
    env_file: .env
    environment:
      - NODE_ENV=production
      - DOCKER_CONTAINER=1
      - WORKSPACE_BASE_DIR=/app/workspace
      - PROJECT_LINK_BASE_DIR=/app/project-links
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      - INITIAL_CREDITS=${INITIAL_CREDITS:-100}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - MERCADO_PAGO_WEBHOOK_SECRET=${MERCADO_PAGO_WEBHOOK_SECRET:-}
      - AGENT_COMMAND_UID=33
      - AGENT_COMMAND_GID=33
      - ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL:-http://localhost:8082}
      - ONLYOFFICE_INTERNAL_URL=http://onlyoffice-documentserver
      - ONLYOFFICE_STORAGE_URL=http://web-agent:89
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET must be set in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-net
    restart: unless-stopped
    depends_on:
      onlyoffice-documentserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:89/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  onlyoffice-documentserver:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-documentserver
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET must be set in .env}
      - JWT_HEADER=Authorization
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=false
      - EXAMPLE_ENABLED=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
    networks:
      - agent-net
    restart: unless-stopped
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

networks:
  agent-net:
    driver: bridge

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
