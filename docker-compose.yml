services:
  web-agent:
    build: .
    container_name: web-agent
    ports:
      - "89:89"
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
    env_file: .env
    environment:
      - NODE_ENV=production
      - DOCKER_CONTAINER=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-net
    restart: unless-stopped

networks:
  agent-net:
    driver: bridge
