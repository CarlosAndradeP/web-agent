services:
  web-agent:
    build: .
    container_name: web-agent
    ports:
      - "89:89"
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
    env_file: .env
    environment:
      - NODE_ENV=production
      - DOCKER_CONTAINER=1
      - WORKSPACE_BASE_DIR=/app/workspace
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      - INITIAL_CREDITS=100
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:89/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  agent-net:
    driver: bridge
